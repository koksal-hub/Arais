[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-automation"
version = "0.1.0"
description = "Modüler YouTube otomasyon platformu"
authors = [{name = "Automation Architect"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "sqlmodel>=0.0.16",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "structlog>=24.1.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "apscheduler>=3.10.4",
  "jinja2>=3.1.4",
  "itsdangerous>=2.2.0",
  "tenacity>=8.3.0",
  "google-api-python-client>=2.130.0",
  "alembic>=1.13.2",
  "python-slugify>=8.0.4",
  "babel>=2.14.0",
  "email-validator>=2.2.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.6",
  "httpx>=0.27.0",
  "requests-mock>=1.11.0",
  "freezegun>=1.5.1"
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["app/tests"]
asyncio_mode = "auto"
